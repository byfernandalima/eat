<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8E5CA">
<meta name="robots" content="noindex">
<title>ëat · Confirmar consulta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/eat.css?v=20261120f">
</head>
<body>
<div class="listras" aria-hidden="true"><i></i><i></i></div>
<header class="topo"><div class="topo-in"><div class="logo">ëat</div></div></header>
<main id="palco"><p class="carregando">carregando…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=20261120f"></script>
<script src="js/nucleo.js?v=20261121e"></script>
<script>
(async () => {
  const p = new URLSearchParams(location.search), id = p.get('c'), token = p.get('t');
  const palco = document.getElementById('palco'), supa = criaSupabase();
  const ee = () => h('div', { class: 'ee grande', 'aria-hidden': 'true' }, h('i', { class: 'olho a' }), h('i', { class: 'olho b' }), h('span', { class: 'letra' }, 'e'));
  const tela = (...filhos) => palco.replaceChildren(h('section', { class: 'hero', style: 'padding-top:18px' }, ee(), ...filhos));
  if (!supa || !ehUUID(id) || !ehUUID(token)) return tela(h('h1', null, 'Link inválido.'), h('p', null, 'Peça um novo link para sua nutri.'));
  const { data, error } = await supa.rpc('consulta_publica', { p_id: id, p_token: token });
  const c = Array.isArray(data) ? data[0] : null;
  if (error || !c) return tela(h('h1', null, 'Consulta não encontrada.'), h('p', null, 'O link pode ter expirado. Fale com sua nutri.'));
  const i = new Date(c.inicio);
  const quando = i.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }) + ' às ' + i.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const info = [
    h('p', { class: 'serif' }, `${c.tipo || 'Consulta'} com ${c.nutri}`),
    h('div', { class: 'card', style: 'padding:18px' },
      h('p', { style: 'margin:0;font-family:var(--titulo);font-weight:800;font-size:24px' }, quando),
      h('p', { class: 'nota', style: 'margin:6px 0 0' }, c.modalidade === 'online' ? 'Online: o link da chamada está abaixo.' : (c.endereco || 'Presencial')),
      c.modalidade === 'online' && c.sala ? h('a', { class: 'btn sec', href: c.sala, target: '_blank', rel: 'noopener', style: 'margin-top:12px' }, 'Link da teleconsulta') : null)
  ];
  const nome = primeiro(c.paciente);
  if (c.status === 'confirmada') return tela(h('h1', null, `Tudo certo${nome ? ', ' + nome : ''}!`), h('p', null, 'Sua consulta já está confirmada.'), ...info);
  if (c.status !== 'agendada' || i < new Date()) return tela(h('h1', null, 'Essa consulta não pode mais ser confirmada.'), h('p', null, 'Se precisar remarcar, fale com sua nutri.'), ...info);
  const msg = h('p', { class: 'form-msg', role: 'status' });
  const btn = h('button', { class: 'btn pri', type: 'button', style: 'width:100%', onclick: async () => {
    btn.disabled = true; btn.textContent = 'Confirmando…';
    const { data: ok, error: e } = await supa.rpc('confirmar_consulta', { p_id: id, p_token: token });
    if (e || !ok) { btn.disabled = false; btn.textContent = 'Tentar de novo'; msg.className = 'form-msg erro'; msg.textContent = 'Não deu para confirmar agora. Tente de novo ou fale com sua nutri.'; return; }
    tela(h('h1', null, 'Confirmado! 💛'), h('p', null, 'Sua nutri já recebeu a confirmação. Até lá!'), ...info);
  } }, 'Confirmar presença');
  tela(h('h1', null, `Oi${nome ? ', ' + nome : ''}!`), ...info, h('div', { class: 'acoes' }, btn), msg,
    h('p', { class: 'nota' }, 'Não vai poder ir? Avise sua nutri pelo WhatsApp para remarcar.'));
})();
</script>
</body>
</html>
